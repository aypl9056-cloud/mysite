<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eFootball Mobile</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

/* خلفية متحركة */
body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#001233,#002855,#7a0000,#ff0000);
  background-size:300% 300%;
  animation:bgMove 7s infinite alternate;
  color:white;
}

@keyframes bgMove{
  0%{background-position:left}
  100%{background-position:right}
}

/* جسيمات */
.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  opacity:.3;
  border-radius:50%;
  animation:float 8s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh)}
  to{transform:translateY(-10vh)}
}

/* شاشة البداية */
.splash{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  letter-spacing:3px;
  z-index:5;
  animation:fade 2.5s forwards;
}

@keyframes fade{
  0%,70%{opacity:1}
  100%{opacity:0;visibility:hidden}
}

/* البطاقة */
.card{
  width:340px;
  padding:35px;
  border-radius:20px;
  background:rgba(0,0,40,.85);
  backdrop-filter:blur(14px);
  box-shadow:0 0 40px red,0 0 60px blue;
  text-align:center;
  position:relative;
}

/* العنوان */
.title{
  font-size:26px;
  margin-bottom:12px;
  background:linear-gradient(45deg,#ff0000,#0099ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* الكوينز */
.coins{
  margin-bottom:12px;
  color:#00ccff;
  font-weight:bold;
}

/* حقول */
input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:none;
  border-radius:10px;
}

/* زر */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#ff0000,#0066ff);
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 20px red;
  transition:.2s;
}

button:hover{
  transform:scale(1.05);
}

/* التحميل */
.loader{
  display:none;
  margin-top:14px;
}

.progress{
  height:14px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff0000,#0066ff);
}

/* رسالة */
.error{
  display:none;
  margin-top:12px;
  color:#ff4444;
  font-weight:bold;
}

/* اهتزاز */
.shake{
  animation:shake .3s;
}

@keyframes shake{
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
}

/* عملة */
.coin{
  position:absolute;
  font-size:20px;
  animation:fall 2s linear forwards;
}

@keyframes fall{
  from{transform:translateY(-50px)}
  to{transform:translateY(120vh)}
}
</style>
</head>

<body>

<div class="splash">LOADING...</div>

<!-- جسيمات -->
<script>
for(let i=0;i<40;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"%";
  p.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(p);
}
</script>

<div class="card" id="card">

  <h1 class="title">eFootball Mobile</h1>

  <div class="coins">Coins: <span id="coins">0</span></div>

  <input placeholder="Username">
  <input type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div class="loader" id="loader">
    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>
    <div id="percent">0%</div>
  </div>

  <div class="error" id="error">
    ⚠️ Server Busy — Try Later
  </div>

</div>

<audio id="click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<script>
function login(){

document.getElementById("click").play();

let loader=document.getElementById("loader");
let bar=document.getElementById("bar");
let percent=document.getElementById("percent");
let error=document.getElementById("error");
let card=document.getElementById("card");
let coins=document.getElementById("coins");

loader.style.display="block";

let i=0;

let load=setInterval(()=>{
i++;
bar.style.width=i+"%";
percent.innerText=i+"%";

if(i>=100){
clearInterval(load);

/* عداد */
let c=0;
let add=setInterval(()=>{
c+=10;
coins.innerText=c;
if(c>=500) clearInterval(add);
},10);

/* سقوط عملات */
for(let j=0;j<25;j++){
let coin=document.createElement("div");
coin.className="coin";
coin.innerText="🪙";
coin.style.left=Math.random()*100+"%";
document.body.appendChild(coin);
}

/* خطأ */
setTimeout(()=>{
error.style.display="block";
card.classList.add("shake");
},1000);

}

},20);

}
</script>

</body>
</html>
